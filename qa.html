<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba responsive del ramo</title>
<style>body{margin:20px;background:#e7e4de;font:14px system-ui}nav{display:flex;gap:12px;margin-bottom:16px}iframe{display:block;border:1px solid #bbb;width:390px;height:844px;background:#faf7ef}button{padding:10px}output{display:block;margin:12px 0;max-width:640px}</style>
<nav><button data-size="390,844">390 × 844</button><button data-size="320,568">320 × 568</button><button data-size="430,932">430 × 932</button><button id="pinch">Probar dos punteros</button></nav><output id="result">Vista de prueba; el enlace del regalo sigue siendo index.html.</output><iframe title="Experiencia móvil" src="./index.html"></iframe>
<script>
const frame=document.querySelector('iframe'),result=document.querySelector('output');
document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{const [w,h]=button.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px';});
document.querySelector('#pinch').onclick=()=>{
 const win=frame.contentWindow,doc=frame.contentDocument,host=doc.querySelector('#bouquet-3d'),canvas=host.querySelector('canvas');
 if(host.dataset.state!=='interactive'){result.textContent='Primero deja terminar el florecimiento.';return;}
 const before=Number(host.dataset.zoom),r=canvas.getBoundingClientRect();
 const send=(type,id,x,y)=>canvas.dispatchEvent(new win.PointerEvent(type,{pointerId:id,pointerType:'touch',clientX:r.x+x,clientY:r.y+y,bubbles:true}));
 // Synthetic pointers are deliberately not captured by the browser: only gesture math is under test.
 const capture=canvas.setPointerCapture;canvas.setPointerCapture=()=>{};
 send('pointerdown',901,130,200);send('pointerdown',902,230,200);send('pointermove',902,280,200);send('pointerup',901,130,200);send('pointerup',902,280,200);canvas.setPointerCapture=capture;
 setTimeout(()=>{result.textContent=`Pinch sintético: zoom ${before} → ${host.dataset.zoom}. ${Number(host.dataset.zoom)<before?'PASS':'FAIL'}. No sustituye una prueba en un teléfono físico.`;},300);
};
</script></html>
