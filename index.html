<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f7f3e9" />
    <meta name="description" content="Un ramo de tulipanes y lirios amarillos que florece para ti." />
    <meta property="og:title" content="Hice algo para ti..." />
    <meta property="og:description" content="Un pequeño regalo que florece al abrirlo." />
    <title>Flores para ti</title>
    <script>document.documentElement.classList.add('js');</script>
    <link rel="stylesheet" href="styles.css" />
  </head>

    <main class="experience" id="experience" data-state="idle">
      <div class="ambient" aria-hidden="true">
        <span class="ambient__wash ambient__wash--one"></span>
        <span class="ambient__wash ambient__wash--two"></span>
        <span class="ambient__grain"></span>
      </div>

      <button class="opening" id="start-gift" type="button" aria-label="Hacer florecer el ramo">
        <span class="opening__copy">
          <span class="opening__title">Hice algo para ti...</span>
          <span class="opening__invitation">Toca aquí <span aria-hidden="true">🌷</span></span>
          <span class="opening__pulse" aria-hidden="true"></span>
        </span>
      </button>

          <div class="particles" aria-hidden="true">
            <i class="light light--1"></i>
            <i class="light light--2"></i>
            <i class="light light--3"></i>
            <i class="light light--4"></i>
            <i class="light light--5"></i>
            <i class="petal-fall petal-fall--1"></i>
            <i class="petal-fall petal-fall--2"></i>
            <i class="petal-fall petal-fall--3"></i>
          </div>

                <stop offset="1" stop-color="#dca72e" />
